name: Update hckr

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hckr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Test formula updater
        run: python3 tests/update_hckr_test.py
      - name: Update from latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_hckr.py
      - name: Check formula syntax
        run: ruby -c Formula/hckr.rb
      - name: Commit formula update
        run: |
          git add Formula/hckr.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hckr: update stable release'
          git push origin HEAD:main
